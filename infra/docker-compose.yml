services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hh_mvp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/hh_mvp}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:3001}

      HH_CLIENT_ID: ${HH_CLIENT_ID:-}
      HH_CLIENT_SECRET: ${HH_CLIENT_SECRET:-}
      HH_REDIRECT_URI: ${HH_REDIRECT_URI:-}
      HH_OAUTH_AUTHORIZE_URL: ${HH_OAUTH_AUTHORIZE_URL:-https://hh.ru/oauth/authorize}
      HH_OAUTH_TOKEN_URL: ${HH_OAUTH_TOKEN_URL:-https://hh.ru/oauth/token}
      AUTH_STATE_TTL_SECONDS: ${AUTH_STATE_TTL_SECONDS:-600}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}

      # OpenAI (Stage 7)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      COVER_LETTER_MIN_CHARS: ${COVER_LETTER_MIN_CHARS:-400}
      COVER_LETTER_MAX_CHARS: ${COVER_LETTER_MAX_CHARS:-4000}
      COVER_LETTER_FORBIDDEN_PHRASES: ${COVER_LETTER_FORBIDDEN_PHRASES:-}

      # Apply limits (Stage 8)
      HH_APPLY_DAILY_LIMIT: ${HH_APPLY_DAILY_LIMIT:-20}
      HH_APPLY_HOURLY_LIMIT: ${HH_APPLY_HOURLY_LIMIT:-5}
      HH_APPLY_MAX_RETRIES: ${HH_APPLY_MAX_RETRIES:-2}

      # Admin sync (Stage 9)
      ADMIN_SYNC_TOKEN: ${ADMIN_SYNC_TOKEN:-}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
      MAX_NEGOTIATIONS_PER_SYNC: ${MAX_NEGOTIATIONS_PER_SYNC:-200}
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

